- name: application setup
  include_role:
    name: common
    tasks_from: app-setup

- name: javasetup setup
  include_role:
    name: common
    tasks_from: java

# - name: java
#   include_role: 
#     name: common
#     tasks_from: java

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup

- name: check cities data exists or network
  command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
  ignore_errors: true
  register: cities_count
  tags:
    mysql

- name: print cities_count
  debug:
    msg: "{{ cities_count }}"
  tags:
      mysql

- name: load cities data into mysql
  shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/master-data.sql
  when: cities_count != 0 or cities_count.stdout | int == 0
  tags:
    mysql

- name: create app user in mysql
  shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/app-user.sql
  tags:
    mysql

- name: restart application
  include_role:
    name: common
    tasks_from: restart